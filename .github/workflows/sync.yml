name: Sync Product Updates

on:
  schedule:
    - cron: '0 * * * *'  # cada hora
  workflow_dispatch:       # permite correrlo manualmente desde GitHub
    inputs:
      reset:
        description: 'Borrar TODA la data antes de sincronizar (limpieza)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          URL="${{ secrets.APP_URL }}/api/sync"
          if [ "${{ inputs.reset }}" = "true" ]; then
            URL="$URL?reset=1"
            echo "Reset activado — se borrará toda la data antes de sincronizar."
          fi
          curl -s -f -X POST "$URL" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET_TOKEN }}" \
            -H "Content-Type: application/json"
